name: Pull and Package Chaos Mesh Images

on:
  workflow_dispatch:
    inputs:
      chaos_mesh_version:
        description: 'Chaos Mesh version tag'
        required: true
        default: 'v2.8.2'
      coredns_version:
        description: 'Chaos CoreDNS version tag'
        required: true
        default: 'v0.2.8'

jobs:
  pull-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: Pull images
      run: |
        docker pull ghcr.io/chaos-mesh/chaos-mesh:${{ github.event.inputs.chaos_mesh_version }}
        docker pull ghcr.io/chaos-mesh/chaos-daemon:${{ github.event.inputs.chaos_mesh_version }}
        docker pull ghcr.io/chaos-mesh/chaos-dashboard:${{ github.event.inputs.chaos_mesh_version }}
        docker pull ghcr.io/chaos-mesh/chaos-coredns:${{ github.event.inputs.coredns_version }}
        docker pull registry.k8s.io/pause:3.9

    - name: Save images to tar.gz
      run: |
        docker save \
          ghcr.io/chaos-mesh/chaos-mesh:${{ github.event.inputs.chaos_mesh_version }} \
          ghcr.io/chaos-mesh/chaos-daemon:${{ github.event.inputs.chaos_mesh_version }} \
          ghcr.io/chaos-mesh/chaos-dashboard:${{ github.event.inputs.chaos_mesh_version }} \
          ghcr.io/chaos-mesh/chaos-coredns:${{ github.event.inputs.coredns_version }} \
          registry.k8s.io/pause:3.9 \
          | gzip > chaos-mesh-images.tar.gz

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chaos-mesh-images
        path: chaos-mesh-images.tar.gz
        retention-days: 7
